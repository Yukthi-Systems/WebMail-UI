<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Status bar: the app's background (light or dark), set from the theme setting once it loads -->
    <meta name="theme-color" content="#fcfcfc" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link href="/src/index.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <script src="/env-config.js"></script>
    <title>Mail Service 25</title>
    <script>
      // Light, like the app, unless dark is chosen in WebMail's settings (saved by the app)
      try {
        var savedTheme = JSON.parse(localStorage.getItem('userSettings') || 'null')?.ui?.theme;
        if (savedTheme === 'dark') {
          document.documentElement.setAttribute('data-loader-theme', 'dark');
          document
            .querySelectorAll('meta[name="theme-color"]')
            .forEach((meta) => meta.setAttribute('content', '#111111'));
        }
      } catch (e) {
        /* no saved theme */
      }
    </script>
    <style>
      :root {
        --loader-bg: #fcfcfc;
        --loader-text: #18181b;
        --loader-muted: #71717a;
        --loader-track: #ebebeb;
        --loader-accent: #f97316;
        --loader-art-warm: #fbdcc4;
        --loader-art-cool: #e6e6e6;
      }
      :root[data-loader-theme='dark'] {
        --loader-bg: #111111;
        --loader-text: #ededed;
        --loader-muted: #a1a1aa;
        --loader-track: #262626;
        --loader-art-warm: #3a2213;
        --loader-art-cool: #242424;
      }

      #global-loader {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--loader-bg);
        z-index: 10000;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        transition:
          opacity 0.3s ease-out,
          visibility 0.3s ease-out;
      }
      #global-loader.hidden {
        opacity: 0;
        visibility: hidden;
      }

      /* Background art: large mail icons in faint line work, blurred, slowly floating */
      .loader-art {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        opacity: 0;
        animation: artIn 1s ease-out 0.1s forwards;
      }
      .loader-art svg {
        position: absolute;
        fill: none;
        stroke-width: 0.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        animation: floatArt 22s ease-in-out infinite alternate;
      }
      .art-warm {
        stroke: var(--loader-art-warm);
      }
      .art-cool {
        stroke: var(--loader-art-cool);
      }
      .art-1 {
        width: 260px;
        top: 6%;
        left: 5%;
        filter: blur(3px);
        transform: rotate(-12deg);
      }
      .art-2 {
        width: 180px;
        top: 10%;
        right: 9%;
        filter: blur(4px);
        transform: rotate(14deg);
        animation-duration: 26s !important;
        animation-delay: -6s !important;
      }
      .art-3 {
        width: 150px;
        bottom: 12%;
        left: 12%;
        filter: blur(4px);
        transform: rotate(10deg);
        animation-duration: 24s !important;
        animation-delay: -3s !important;
      }
      .art-4 {
        width: 240px;
        bottom: 6%;
        right: 6%;
        filter: blur(3px);
        transform: rotate(-8deg);
        animation-duration: 28s !important;
        animation-delay: -10s !important;
      }
      .art-5 {
        width: 110px;
        top: 44%;
        left: 26%;
        filter: blur(5px);
        transform: rotate(-20deg);
        animation-duration: 20s !important;
        animation-delay: -8s !important;
      }
      .art-6 {
        width: 130px;
        top: 40%;
        right: 24%;
        filter: blur(5px);
        transform: rotate(18deg);
        animation-duration: 25s !important;
        animation-delay: -12s !important;
      }
      @media (max-width: 720px) {
        .art-1 {
          width: 170px;
          top: 4%;
          left: -8%;
        }
        .art-2 {
          width: 120px;
          top: 14%;
          right: -4%;
        }
        .art-3 {
          width: 110px;
          bottom: 16%;
          left: -2%;
        }
        .art-4 {
          width: 170px;
          bottom: 3%;
          right: -10%;
        }
        .art-5,
        .art-6 {
          display: none;
        }
      }
      @keyframes artIn {
        to {
          opacity: 1;
        }
      }
      @keyframes floatArt {
        from {
          translate: 0 0;
          rotate: 0deg;
        }
        to {
          translate: 0 -18px;
          rotate: 4deg;
        }
      }

      .loader-container {
        position: relative;
        padding: 0 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Shown after a moment, so a fast start does not flash it */
        opacity: 0;
        animation: loaderIn 0.45s cubic-bezier(0.2, 0.7, 0.3, 1) 0.1s forwards;
      }

      /* The app icon: the envelope settles in and its flap draws itself */
      .loader-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 20px;
        border-radius: 16px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.06),
          0 6px 16px rgba(0, 0, 0, 0.06);
      }
      .loader-icon-body {
        transform-box: fill-box;
        transform-origin: center;
        transform: scale(0.86);
        opacity: 0;
        animation: bodyIn 0.5s cubic-bezier(0.2, 0.7, 0.3, 1) 0.25s forwards;
      }
      .loader-icon-flap {
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: flapDraw 0.7s cubic-bezier(0.65, 0, 0.35, 1) 0.6s forwards;
      }

      .loader-title {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--loader-text);
      }
      .loader-subtitle {
        margin: 4px 0 20px;
        font-size: 13px;
        color: var(--loader-muted);
      }

      .progress-bar {
        position: relative;
        width: 120px;
        height: 3px;
        background: var(--loader-track);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 36%;
        border-radius: 999px;
        background: var(--loader-accent);
        animation: progressSlide 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes loaderIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes bodyIn {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes flapDraw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes progressSlide {
        from {
          left: -36%;
        }
        to {
          left: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-art,
        .loader-art svg,
        .loader-container,
        .loader-icon-body,
        .loader-icon-flap {
          animation: none;
          opacity: 1;
          transform: none;
          stroke-dashoffset: 0;
        }
        .progress-fill {
          animation-duration: 2.6s;
        }
      }
    </style>
  </head>

  <body>
    <div id="global-loader">
      <div class="loader-art" aria-hidden="true">
        <!-- Envelope -->
        <svg class="art-1 art-warm" viewBox="0 0 24 24">
          <rect x="2" y="4.5" width="20" height="15" rx="2.2" />
          <path d="M2.6 6.5 12 13l9.4-6.5" />
        </svg>
        <!-- Paper plane -->
        <svg class="art-2 art-cool" viewBox="0 0 24 24">
          <path d="M21.5 2.5 2.8 10.2l7.4 3.1 3.1 7.4z" />
          <path d="m21.5 2.5-11.3 10.8" />
        </svg>
        <!-- @ -->
        <svg class="art-3 art-cool" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8" />
        </svg>
        <!-- Open letter -->
        <svg class="art-4 art-warm" viewBox="0 0 24 24">
          <path
            d="M21.2 8.4c.5.4.8 1 .8 1.6v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9c0-.6.3-1.2.8-1.6l8-6a2 2 0 0 1 2.4 0z"
          />
          <path d="m2.5 9.5 8.5 5.6a1.9 1.9 0 0 0 2 0l8.5-5.6" />
        </svg>
        <!-- Paperclip -->
        <svg class="art-5 art-warm" viewBox="0 0 24 24">
          <path
            d="m21.4 11-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"
          />
        </svg>
        <!-- Inbox tray -->
        <svg class="art-6 art-cool" viewBox="0 0 24 24">
          <path d="M22 12h-6l-2 3h-4l-2-3H2" />
          <path
            d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"
          />
        </svg>
      </div>
      <div class="loader-container">
        <svg class="loader-icon" viewBox="0 0 512 512" aria-hidden="true">
          <rect width="512" height="512" rx="128" fill="#f97316" />
          <g class="loader-icon-body">
            <rect x="112" y="148" width="288" height="216" rx="30" fill="#ffffff" />
          </g>
          <path
            class="loader-icon-flap"
            d="M136 182 L256 268 L376 182"
            fill="none"
            stroke="#f97316"
            stroke-width="22"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <h1 class="loader-title">Mail Service 25</h1>
        <p class="loader-subtitle">Loading your workspace</p>

        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      window.hideGlobalLoader = () => {
        const loader = document.getElementById('global-loader');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(() => {
            loader.style.display = 'none';
          }, 250);
        }
      };

      setTimeout(() => {
        if (
          document.getElementById('global-loader') &&
          !document.getElementById('global-loader').classList.contains('hidden')
        ) {
          window.hideGlobalLoader();
        }
      }, 3000);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
